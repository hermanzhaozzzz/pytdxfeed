[project]
name = "pytdxfeed"
version = "1.0.4"
description = "Python client and macOS service manager for a local tdx-api market data service."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [
    { name = "Huanan Herman Zhao", email = "hermanzhaozzzz@gmail.com" },
]
keywords = ["a-share", "market-data", "tdx", "tongdaxin"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "requests>=2.32.0,<3.0.0",
]

[project.urls]
Homepage = "https://pypi.org/project/pytdxfeed/"
Repository = "https://github.com/hermanzhaozzzz/pytdxfeed"
Issues = "https://github.com/hermanzhaozzzz/pytdxfeed/issues"
Releases = "https://github.com/hermanzhaozzzz/pytdxfeed/releases"
"Bundled tdx-api" = "https://github.com/hermanzhaozzzz/tdx-api/commit/e6778c6b8ec4cbf0705dc1fe4c3c413a6b6518ff"

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytdxfeed"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/scripts",
    "/benchmarks",
    "/release",
    "/README.md",
    "/README_zh.md",
    "/LICENSE",
    "/AGENTS.md",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["A", "B", "C4", "D", "E", "F", "I", "N", "PERF", "RUF", "S", "SIM", "UP", "W"]
ignore = ["D105", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S108"]
"scripts/**" = ["D103", "S603"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
