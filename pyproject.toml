[project]
name = "pytdxfeed"
version = "0.2.0"
description = "Private macOS runtime and HTTP client for oficcejo/tdx-api."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Huanan Herman Zhao", email = "hermanzhaozzzz@gmail.com" },
]
dependencies = [
    "requests>=2.32.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytdxfeed"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/scripts",
    "/patches",
    "/README.md",
    "/AGENTS.md",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["A", "B", "C4", "D", "E", "F", "I", "N", "PERF", "RUF", "S", "SIM", "UP", "W"]
ignore = ["D105", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S108"]
"scripts/**" = ["D103", "S603"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
